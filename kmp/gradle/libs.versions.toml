[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
serialization = "1.11.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
media3 = "1.11.1"
room = "2.8.5"
work = "2.12.0"
okhttp = "5.3.0"
coroutines = "1.10.2"
coreKtx = "1.18.0"
junit = "4.13.2"
hilt = "2.60.1"
